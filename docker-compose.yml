services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: okf
      POSTGRES_USER: okf
      POSTGRES_PASSWORD: okf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_password
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://okf:okf_dev_password@postgres:5432/okf
      DEFAULT_USER_EMAIL: demo@example.com
      ADMIN_EMAIL: admin@magica.local
      ADMIN_PASSWORD: admin12345
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio_dev_password
      OBJECT_STORAGE_BUCKET: documents
      REDIS_ADDR: redis:6379
      JOB_QUEUE: okf:jobs
      AUTH_SECRET: local-development-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://okf:okf_dev_password@postgres:5432/okf
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio_dev_password
      OBJECT_STORAGE_BUCKET: documents
      REDIS_ADDR: redis:6379
      JOB_QUEUE: okf:jobs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
